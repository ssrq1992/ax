# PATCH(local-env): gcr.io / cgr.dev unreachable; base image served from the
# local plain-HTTP registry (mirrored docker.io/library/alpine:3.24 via 1ms.run).
defaultBaseImage: 192.168.178.139:5000/library/alpine:3.24@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
baseImageOverrides:
  # PATCH(local-env): docker.io unreachable for ko; skipped building task-runner here.
  github.com/google/ax/cmd/ax-task-runner: 192.168.178.139:5000/library/alpine:3.24@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
builds:
  - id: ax-server
    main: ./cmd/ax-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: ax-task-runner
    main: ./cmd/ax-task-runner
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w

