apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-server
  namespace: ax-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ax-server
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ax-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      serviceAccountName: ax-server
      containers:
        - name: ax-server
          image: ko://github.com/google/ax/cmd/ax-server
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--managed-addr=:8443"
            - "--managed-config=/run/ax-managed/managed.json"
            - "--managed-ledger-epoch=$(AX_MANAGED_LEDGER_EPOCH)"
            - "--tls-cert-file=/run/ax-tls/tls.crt"
            - "--tls-key-file=/run/ax-tls/tls.key"
            - "--tls-client-ca-file=/run/ax-client-ca/ca.crt"
            - "--redis-addr=ax-redis.ax-system.svc.cluster.local:6379"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=ax-system"
          env:
            - name: AX_MANAGED_LEDGER_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: ax-managed
                  key: ledgerEpoch
            - name: ATENET_ROUTER_ADDR
              value: "atenet-router.ate-system.svc.cluster.local:80"
            - name: AX_SNAPSHOTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: ax-managed
                  key: ordinarySnapshotsBucket
          ports:
            - containerPort: 8443
              name: managed
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: managed-config
              mountPath: /run/ax-managed
              readOnly: true
            - name: managed-tls
              mountPath: /run/ax-tls
              readOnly: true
            - name: managed-client-ca
              mountPath: /run/ax-client-ca
              readOnly: true
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: managed-config
          configMap:
            name: ax-managed
        - name: managed-tls
          secret:
            secretName: ax-server-tls
        - name: managed-client-ca
          secret:
            secretName: ax-client-ca
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8443
      targetPort: 8443
      name: managed
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ax-server
