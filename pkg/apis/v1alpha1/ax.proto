syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

// AX defines the core control plane gRPC service for autonomous agent orchestration.
service AX {
  // Manifests are parsed by the client (see `ax apply`) and submitted through the
  // typed Update* RPCs below; the server never receives raw YAML.

  // Tasks
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc SuspendTask(SuspendTaskRequest) returns (Task);
  rpc ResumeTask(ResumeTaskRequest) returns (Task);
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse);


  // Managed runtime resources. Existing ungrouped Task behavior is unchanged.
  rpc CreateTaskGroup(CreateTaskGroupRequest) returns (TaskGroup);
  rpc GetTaskGroup(GetTaskGroupRequest) returns (TaskGroup);
  rpc ListTaskGroups(ListTaskGroupsRequest) returns (ListTaskGroupsResponse);
  rpc UpdateTaskGroup(UpdateTaskGroupRequest) returns (TaskGroup);
  rpc DeleteTaskGroup(DeleteTaskGroupRequest) returns (DeleteTaskGroupResponse);
  rpc PrepareRuntime(PrepareRuntimeRequest) returns (PreparedRuntime);
  rpc GetPreparedRuntime(GetPreparedRuntimeRequest) returns (PreparedRuntime);
  rpc ReleasePreparedRuntime(ReleasePreparedRuntimeRequest) returns (ReleasePreparedRuntimeResponse);
  rpc PauseTask(PauseTaskRequest) returns (Task);
  rpc CreateTaskCheckpoint(CreateTaskCheckpointRequest) returns (TaskCheckpoint);
  rpc GetTaskCheckpoint(GetTaskCheckpointRequest) returns (TaskCheckpoint);
  rpc DeleteTaskCheckpoint(DeleteTaskCheckpointRequest) returns (DeleteTaskCheckpointResponse);
  rpc AuthenticateRuntime(AuthenticateRuntimeRequest) returns (AuthenticateRuntimeResponse);

  // Workspaces
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Models
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc UpdateModel(UpdateModelRequest) returns (Model);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

}

// ObjectMeta is metadata for AX resources.
message ObjectMeta {
  string name = 1;
  string atespace = 2;
  google.protobuf.Timestamp creation_timestamp = 3;
  string uid = 4;
  uint64 resource_version = 5;
}

// --- Task ---

message Task {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  TaskSpec spec = 4;
  TaskStatus status = 5;
}

message TaskSpec {
  string image = 1;
  repeated string command = 2;
  repeated EnvVar env = 3;
  ResourceReqs resources = 4;
  // workspaces binds one or more Workspaces, each mounted at its own path
  // under /workspace. The first entry is the task command's working directory.
  repeated WorkspaceRef workspaces = 5;
  // debug enables the in-container guest services (process execution and file
  // access) that back `ax ssh`. Off by default.
  bool debug = 6;
  ResourceRef group_ref = 7;
  ResourceRef prepared_runtime_ref = 8;
  ResourceRef restore_from = 9;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message ResourceReqs {
  ResourceList requests = 1;
  ResourceList limits = 2;
}

message ResourceList {
  string cpu = 1;
  string memory = 2;
}

message WorkspaceRef {
  string name = 1;
  string path = 2;
  string goal = 3;
}

message TaskStatus {
  string phase = 1;
  string id = 2;
  string actor = 3;
  // json_name keeps the established `workerIP` spelling in YAML and JSON.
  string worker_ip = 4 [json_name = "workerIP"];
  PendingApproval pending_approval = 5;
  UsageStats usage = 6;
  repeated Condition conditions = 7;
  TaskRuntimeStatus runtime_status = 8;
}

message PendingApproval {
  string id = 1;
  string action = 2;
  google.protobuf.Timestamp requested_at = 3;
}

message UsageStats {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
}

message Condition {
  string type = 1;
  string status = 2;
  google.protobuf.Timestamp last_transition_time = 3;
  string reason = 4;
  string message = 5;
}

// --- Workspace ---

message Workspace {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkspaceSpec spec = 4;
}

message WorkspaceSpec {
  repeated GitRepo git = 1;
  repeated File files = 2;
  MCPConfig mcp = 3;
  SkillsConfig skills = 4;
}

message GitRepo {
  string name = 1;
  string repo = 2;
  string branch = 3;
  string dir = 4;
  int32 depth = 5;
}

message File {
  string path = 1;
  string content = 2;
}

message MCPConfig {
  repeated MCPRegistry registries = 1;
  repeated MCPServer servers = 2;
}

message MCPRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
  repeated MCPServer servers = 4;
}

message MCPServer {
  string name = 1;
  string endpoint = 2;
  string command = 3;
  repeated string args = 4;
}

message SkillsConfig {
  repeated SkillRegistry registries = 1;
  string path = 2;
}

message SkillRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
}

// --- Model ---

message Model {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ModelSpec spec = 4;
}

message ModelSpec {
  string provider = 1;
  string model = 2;
  // Fields 3-5 were typed temperature, max_tokens, and system_instruction;
  // provider settings now live in the free-form `parameters` map.
  reserved 3, 4, 5;
  reserved "temperature", "max_tokens", "system_instruction";
  SecretKeyRef secret_key = 6;
  // parameters are provider-specific generation settings passed through to the
  // model API as-is, for example temperature or maxOutputTokens for Gemini.
  google.protobuf.Struct parameters = 7;
}

message SecretKeyRef {
  string name = 1;
  string key = 2;
}

// --- RPC Request & Response Messages ---

// Tasks
message GetTaskRequest {
  string atespace = 1;
  string name = 2;
  bool refresh_runtime = 3;
}

message ListTasksRequest {
  string atespace = 1;
  int64 limit = 2;
  int64 offset = 3;
  // Lists only managed Tasks. Requires an explicit atespace and managed mTLS.
  // The default retains ordinary Task listing behavior.
  bool managed_only = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  Task task = 1;
  string request_id = 2;
}

message DeleteTaskRequest {
  string atespace = 1;
  string name = 2;
  string expected_uid = 3;
  string operation_id = 4;
}

message DeleteTaskResponse {}

message SuspendTaskRequest {
  string atespace = 1;
  string name = 2;
  string expected_uid = 3;
  string operation_id = 4;
}

message ResumeTaskRequest {
  string atespace = 1;
  string name = 2;
  string expected_uid = 3;
  string operation_id = 4;
}

message WatchTaskRequest {
  string atespace = 1;
  string name = 2;
}

message WatchTaskResponse {
  Task task = 1;
  string action = 2;
}

// Workspaces
message GetWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message ListWorkspacesRequest {
  string atespace = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteWorkspaceResponse {}

// Models
message GetModelRequest {
  string atespace = 1;
  string name = 2;
}

message ListModelsRequest {
  string atespace = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message UpdateModelRequest {
  Model model = 1;
}

message DeleteModelRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteModelResponse {}


// References are AX identities, never backend resource addresses.
message ResourceRef { string atespace = 1; string name = 2; string uid = 3; }
message TaskGroup {
  string api_version = 1; string kind = 2; ObjectMeta metadata = 3;
  TaskGroupSpec spec = 4; TaskGroupStatus status = 5;
}
message TaskGroupSpec {
  optional int32 replicas = 1;
  string sandbox_class = 2;
  string snapshot_location = 3;
}
message TaskGroupStatus { string phase = 1; int32 ready_workers = 2; string message = 3; }
message CreateTaskGroupRequest { TaskGroup group = 1; string request_id = 2; }
message GetTaskGroupRequest { string atespace = 1; string name = 2; }
message ListTaskGroupsRequest { string atespace = 1; int32 page_size = 2; string page_token = 3; }
message ListTaskGroupsResponse { repeated TaskGroup groups = 1; string next_page_token = 2; }
message UpdateTaskGroupRequest { ResourceRef ref = 1; uint64 expected_version = 2; int32 replicas = 3; }
message DeleteTaskGroupRequest { ResourceRef ref = 1; string operation_id = 2; }
message DeleteTaskGroupResponse {}

message Readiness { string path = 1; int32 port = 2; int32 timeout_seconds = 3; }
message CredentialSecretRef { string namespace = 1; string name = 2; string key = 3; }
message EgressCredential {
  string hostname = 1; string header = 2; string prefix = 3; CredentialSecretRef secret_key_ref = 4;
}
message EgressSpec { repeated string destinations = 1; repeated EgressCredential credentials = 2; }
message PreparedRuntimeSpec {
  ResourceRef group_ref = 1;
  // Service or Sandbox; no arbitrary backend fields are accepted.
  string kind = 2;
  string image = 3; repeated string command = 4; repeated string args = 5;
  repeated EnvVar env = 6; ResourceReqs resources = 7; Readiness readiness = 8;
  EgressSpec egress = 9; string snapshot_location_override = 10;
}
message PreparedRuntime {
  ObjectMeta metadata = 1; PreparedRuntimeSpec spec = 2;
  string digest = 3; string phase = 4; string message = 5;
}
message PrepareRuntimeRequest { ObjectMeta metadata = 1; PreparedRuntimeSpec spec = 2; string request_id = 3; }
message GetPreparedRuntimeRequest { ResourceRef ref = 1; }
message ReleasePreparedRuntimeRequest { ResourceRef ref = 1; string operation_id = 2; }
message ReleasePreparedRuntimeResponse {}
message TaskRuntimeStatus {
  string phase = 1; uint64 execution_version = 2; string last_operation_id = 3;
  string boundary_ref = 4; bool restorable = 5; string message = 6;
}
message PauseTaskRequest { ResourceRef ref = 1; string operation_id = 2; }
message TaskCheckpoint {
  ObjectMeta metadata = 1; ResourceRef source_task = 2; ResourceRef runtime_ref = 3;
  ResourceRef group_ref = 4; string phase = 5; string boundary_ref = 6; string message = 7;
}
message CreateTaskCheckpointRequest {
  string name = 1; ResourceRef task_ref = 2; string expected_boundary_ref = 3; string request_id = 4;
}
message GetTaskCheckpointRequest { ResourceRef ref = 1; }
message DeleteTaskCheckpointRequest { ResourceRef ref = 1; string operation_id = 2; }
message DeleteTaskCheckpointResponse {}
message AuthenticateRuntimeRequest { string credential = 1; string atespace = 2; }
message AuthenticateRuntimeResponse { ResourceRef task_ref = 1; repeated string scopes = 2; }
